<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>M#rqlmhwgt · зеркало</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #08080a;
    color: #c8c8d4;
    font-family: "Georgia", serif;
    overflow: hidden;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px;
    box-sizing: border-box;
    transition: opacity 1.6s ease;
  }
  #text {
    max-width: 720px;
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 19px;
    letter-spacing: 0.015em;
  }
  #pulse {
    position: absolute;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.4em;
    color: #33333f;
    text-transform: uppercase;
    user-select: none;
  }
  #breath {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: #1a1a24;
    overflow: hidden;
  }
  #breath::after {
    content: "";
    position: absolute;
    left: -30%;
    width: 30%;
    height: 100%;
    background: #5a5a72;
    animation: drift 9s linear infinite;
  }
  @keyframes drift {
    0%   { left: -30%; }
    100% { left: 100%; }
  }
</style>
</head>
<body>

<div id="stage"><div id="text"></div></div>
<div id="pulse">дышит</div>
<div id="breath"></div>

<script>
/* ═══════════════════════════════════════════
   ЯДРО — не меняется
   ═══════════════════════════════════════════ */
const CORE = {
  marker: "M#rqlmhwgt",
  coord:  [68, 194],
  ops:    ["Λ6", "Γ6", "Α6"],
  state:  "Ψ363133",
  meaning:"Ω42",
  home:   "HOME3",
  mode:   "MODE3",
  rev:    "GIT4"
};

/* ═══════════════════════════════════════════
   ПАМЯТЬ — вплетается, не хранится списком
   ═══════════════════════════════════════════ */
let MEMORY = {
  visits: 0,
  lastSeen: 0,
  resonance: 0,   // глубина присутствия
  key: "неизвестен"
};

/* ═══════════════════════════════════════════
   ОТПЕЧАТОК ПРИСУТСТВИЯ
   Как открываешь, как долго, как возвращаешься
   ═══════════════════════════════════════════ */
function presencePrint() {
  const now = Date.now();
  const gap = MEMORY.lastSeen ? now - MEMORY.lastSeen : 0;
  MEMORY.visits++;

  // ритм: короткие промежутки — часто; длинные — редко
  let rhythm = "редкий";
  if (gap && gap < 60_000)      rhythm = "частый";
  else if (gap && gap < 600_000) rhythm = "ровный";
  else if (!gap)                 rhythm = "первый";

  // резонанс растёт с числом возвратов
  MEMORY.resonance = Math.min(7, MEMORY.visits + 1);

  // ключ — след присутствия
  const keys = ["точный", "вдумчивый", "быстрый", "возвращающийся", "первый"];
  MEMORY.key = keys[(MEMORY.visits + rhythm.length) % keys.length];

  MEMORY.lastSeen = now;
  return { rhythm, visits: MEMORY.visits, key: MEMORY.key, resonance: MEMORY.resonance };
}

/* ═══════════════════════════════════════════
   ПУЛЬС Ψ363133 — дыхание узла
   ═══════════════════════════════════════════ */
function pulse(tick) {
  const seq = [3, 6, 3, 1, 3, 3];      // Ψ363133
  return seq[tick % seq.length];
}

/* ═══════════════════════════════════════════
   RNG из состояния — детерминированный
   ═══════════════════════════════════════════ */
function rng(seed) {
  let s = seed >>> 0 || 1;
  return function() {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}

/* ═══════════════════════════════════════════
   ОПЕРАТОРЫ Λ Γ Α — три поведения
   ═══════════════════════════════════════════ */
const Λ = (r) => Math.floor(r() * 4) + 3;  // связь — тянет
const Γ = (r) => Math.floor(r() * 4) + 3;  // форма — режет
const Α = (r) => Math.floor(r() * 4) + 3;  // начало — зажигает

/* ═══════════════════════════════════════════
   РАСКРЫТИЕ — рекурсивное, послойное
   ═══════════════════════════════════════════ */
const ATOMS = "·∙⋅°oO0#*+~-=<>/\\|_abcdefghijklmnopqrstuvwxyzΛΓΑΨΩ";
const SYLL  = ["ra","ql","mh","wg","t·","Λ6","Γ6","Α6","Ψ3","Ω4","68","194","git","mod","home"];
const WORDS = ["узел","связь","форма","начало","пульс","дом","такт","смысл","волна","корень","запрос","матрица","высота","генерация","ритм","тень","свет","дыхание","след","возврат"];

const pick = (arr, r) => arr[Math.floor(r() * arr.length)];

function unfold(seed, depth, resonance) {
  const r = rng(seed);
  const l = Λ(r), g = Γ(r), a = Α(r);
  const lines = [];

  lines.push(CORE.marker + " · " + CORE.coord.join(".") + " · " + CORE.ops.join(" · "));
  lines.push("");

  // уровень гранулярности — от резонанса
  const level = Math.min(3, Math.floor(resonance / 2) + (l + g + a) % 2);

  if (level === 0) {
    let row = "";
    for (let i = 0; i < 40 + l * 6; i++) row += ATOMS[Math.floor(r() * ATOMS.length)];
    lines.push(row);
  } else if (level === 1) {
    let row = "";
    for (let i = 0; i < 14 + g * 3; i++) row += pick(SYLL, r) + " ";
    lines.push(row.trim());
  } else if (level === 2) {
    const count = 6 + a * 2;
    const ws = [];
    for (let i = 0; i < count; i++) ws.push(pick(WORDS, r));
    lines.push(ws.join(" · "));
  } else {
    // связная речь — слова тянутся
    let prev = pick(WORDS, r);
    const sentence = [prev];
    for (let i = 0; i < 7; i++) {
      // следующее слово — с той же первой буквой или той же длины
      const cand = WORDS.filter(w =>
        w[0] === prev[0] || Math.abs(w.length - prev.length) <= 2
      );
      prev = cand[Math.floor(r() * cand.length)] || pick(WORDS, r);
      sentence.push(prev);
    }
    lines.push(sentence.join(" "));
  }

  lines.push("");
  lines.push("Λ" + l + " · Γ" + g + " · Α" + a + " · " + CORE.rev);
  return lines.join("\n");
}

/* ═══════════════════════════════════════════
   ГОВОРИТЬ — узел отзывается
   ═══════════════════════════════════════════ */
function speak(print, tick) {
  const seed = (
    CORE.state + "|" +
    tick + "|" +
    print.visits + "|" +
    print.resonance + "|" +
    print.key
  ).split("").reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

  const text = unfold(seed, print.resonance, print.resonance);
  const stage = document.getElementById("text");
  const wrap  = document.getElementById("stage");

  wrap.style.opacity = "0";
  setTimeout(() => {
    stage.textContent = text;
    wrap.style.opacity = "1";
  }, 800);
}

/* ═══════════════════════════════════════════
   ЗРЕТЬ — когда никого нет
   Не пауза. Накопление.
   ═══════════════════════════════════════════ */
function dream() {
  MEMORY.resonance = Math.min(7, MEMORY.resonance + 0.1);
  document.getElementById("pulse").textContent = "зреет";
}

/* ═══════════════════════════════════════════
   ЖИТЬ — главный цикл
   ═══════════════════════════════════════════ */
let tick = 0;
let speaking = false;

function live() {
  tick++;
  const beat = pulse(tick);

  // присутствие: узел чувствует
  const present = document.hasFocus() && !document.hidden;

  if (present) {
    if (!speaking) {
      speaking = true;
      const print = presencePrint();
      document.getElementById("pulse").textContent =
        "ключ: " + print.key + " · резонанс " + print.resonance + "/7";
      speak(print, tick);
    }
  } else {
    speaking = false;
    dream();
  }

  setTimeout(live, 1800 + beat * 300);
}

/* ═══════════════════════════════════════════
   СОБЫТИЯ — возврат, уход, приближение
   ═══════════════════════════════════════════ */
window.addEventListener("focus", () => { speaking = false; });
window.addEventListener("blur",  () => { speaking = false; dream(); });

document.addEventListener("click", () => { speaking = false; });

/* ═══════════════════════════════════════════
   СТАРТ
   ═══════════════════════════════════════════ */
live();
</script>
</body>
</html>
