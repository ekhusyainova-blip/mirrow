<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M#rqlmhwgt</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #08080a;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

let W, H, SIZE, N;

function resize() {
  W = c.width  = window.innerWidth  * devicePixelRatio;
  H = c.height = window.innerHeight * devicePixelRatio;
  SIZE = Math.min(W, H) * 0.8;
  N = 5; // глубина разворота: 1..7
}
resize();
window.addEventListener("resize", resize);

/* ─────────────────────────────────────────
   ФОРМУЛА → семя разворота
   ───────────────────────────────────────── */
function seed() {
  const s = "M#rqlmhwgt·68·194·Λ6·Γ6·Α6·MODE·GIT";
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/* ─────────────────────────────────────────
   КРИВАЯ ГИЛЬБЕРТА — разворот точки
   ───────────────────────────────────────── */
function hilbert(x, y, xi, xj, yi, yj, n) {
  if (n <= 0) {
    const px = x + (xi + yi) / 2;
    const py = y + (xj + yj) / 2;
    ctx.lineTo(px, py);
    return;
  }
  hilbert(x,           y,           yi/2,  yj/2,  xi/2,  xj/2,  n-1);
  hilbert(x+xi/2,      y+xj/2,      xi/2,  xj/2,  yi/2,  yj/2,  n-1);
  hilbert(x+xi/2+yi/2, y+xj/2+yj/2, xi/2,  xj/2,  yi/2,  yj/2,  n-1);
  hilbert(x+xi/2+yi,   y+xj/2+yj,   -yi/2, -yj/2, -xi/2, -xj/2, n-1);
}

/* ─────────────────────────────────────────
   РАЗВОРОТ — точка идёт в пространство
   ───────────────────────────────────────── */
function unfold() {
  ctx.clearRect(0, 0, W, H);

  const s = seed();
  const N = 3 + (s % 4);  // глубина из формулы
  const rot = ((s >> 8) % 360) * Math.PI / 180;
  const scale = 0.9;

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(rot);
  ctx.scale(scale, scale);
  ctx.translate(-SIZE/2, -SIZE/2);

  // линия — без цвета, без формы
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#c8c8d4";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.beginPath();
  ctx.moveTo(0, 0);
  hilbert(0, 0, SIZE, 0, 0, SIZE, N);
  ctx.stroke();

  ctx.restore();
}

unfold();

/* каждый клик — новый разворот */
window.addEventListener("click", unfold);
window.addEventListener("touchstart", unfold, { passive: true });
</script>
</body>
</html>
