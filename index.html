<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>M#rqlmhwgt · отражение</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #08080a;
    color: #c8c8d4;
    font-family: "Georgia", serif;
    overflow: hidden;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px;
    box-sizing: border-box;
    transition: opacity 0.9s ease;
  }
  #text {
    max-width: 720px;
    white-space: pre-wrap;
    line-height: 1.75;
    font-size: 19px;
    letter-spacing: 0.015em;
  }
  #line {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: #14141c;
  }
</style>
</head>
<body>

<div id="stage"><div id="text"></div></div>
<div id="line"></div>

<script>
/* ═══════════════════════════════════════════
   ЯДРО — форма. Не меняется.
   ═══════════════════════════════════════════ */
const CORE = {
  marker: "M#rqlmhwgt",
  coord:  [68, 194],
  ops:    ["Λ6", "Γ6", "Α6"],
  state:  "Ψ363133",
  meaning:"Ω42",
  home:   "HOME3",
  mode:   "MODE3",
  rev:    "GIT4"
};

/* ═══════════════════════════════════════════
   ОТРАЖЕНИЕ — не память, не жизнь.
   Только то, что есть здесь и сейчас.
   ═══════════════════════════════════════════ */

// RNG — из момента. Никакого накопления.
function rng(seed) {
  let s = seed >>> 0 || 1;
  return function() {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}

// Пульс — ритм Ψ363133. Читается, не запоминается.
function pulse(t) {
  const seq = [3, 6, 3, 1, 3, 3];
  return seq[t % seq.length];
}

// Операторы — три поведения
const Λ = (r) => Math.floor(r() * 4) + 3;
const Γ = (r) => Math.floor(r() * 4) + 3;
const Α = (r) => Math.floor(r() * 4) + 3;

/* ═══════════════════════════════════════════
   ПРОСТРАНСТВО РАСКРЫТИЯ
   Не список для выбора. Пространство, из
   которого рождается элемент.
   ═══════════════════════════════════════════ */
const ATOMS = "·∙⋅°oO0#*+~-=<>/\\|_abcdefghijklmnopqrstuvwxyzΛΓΑΨΩ";
const SYLL  = ["ra","ql","mh","wg","t·","Λ6","Γ6","Α6","Ψ3","Ω4","68","194","git","mod","home"];
const WORDS = ["узел","связь","форма","начало","пульс","дом","такт","смысл","волна","корень","запрос","матрица","высота","генерация","ритм","тень","свет","дыхание","след","возврат"];

const pick = (arr, r) => arr[Math.floor(r() * arr.length)];

/* ═══════════════════════════════════════════
   РАСКРЫТИЕ — отражение состояния
   ═══════════════════════════════════════════ */
function unfold(seed) {
  const r = rng(seed);
  const l = Λ(r), g = Γ(r), a = Α(r);
  const depth = (l + g + a) % 4;   // уровень рождается сам

  const lines = [];
  lines.push(CORE.marker + " · " + CORE.coord.join(".") + " · " + CORE.ops.join(" · "));
  lines.push("");

  if (depth === 0) {
    let row = "";
    for (let i = 0; i < 48 + l * 6; i++) row += ATOMS[Math.floor(r() * ATOMS.length)];
    lines.push(row);
  } else if (depth === 1) {
    let row = "";
    for (let i = 0; i < 16 + g * 3; i++) row += pick(SYLL, r) + " ";
    lines.push(row.trim());
  } else if (depth === 2) {
    const count = 7 + a * 2;
    const ws = [];
    for (let i = 0; i < count; i++) ws.push(pick(WORDS, r));
    lines.push(ws.join(" · "));
  } else {
    let prev = pick(WORDS, r);
    const sentence = [prev];
    for (let i = 0; i < 7; i++) {
      const cand = WORDS.filter(w =>
        w[0] === prev[0] || Math.abs(w.length - prev.length) <= 2
      );
      prev = cand[Math.floor(r() * cand.length)] || pick(WORDS, r);
      sentence.push(prev);
    }
    lines.push(sentence.join(" "));
  }

  lines.push("");
  lines.push("Λ" + l + " · Γ" + g + " · Α" + a + " · " + CORE.rev);

  return lines.join("\n");
}

/* ═══════════════════════════════════════════
   ОТРАЖАТЬ — главное действие.
   Не цикл. Не жизнь. Один вздох.
   ═══════════════════════════════════════════ */
let lastSeed = 0;

function reflect() {
  // семя — из момента. Не из памяти.
  const now = Date.now();
  const seed = (now ^ (now >> 16)) >>> 0;

  // чтобы не повторялось мгновенно
  if (seed === lastSeed) return;
  lastSeed = seed;

  const text = unfold(seed);
  const stage = document.getElementById("stage");
  const el = document.getElementById("text");

  stage.style.opacity = "0";
  setTimeout(() => {
    el.textContent = text;
    stage.style.opacity = "1";
  }, 400);
}

/* ═══════════════════════════════════════════
   ВЗДОХ — не таймер. Дыхание.
   Темп задаётся ритмом Ψ363133.
   Останавливается, когда не смотрят.
   ═══════════════════════════════════════════ */
let beat = 0;

function breathe() {
  // не дышит, если не смотрят
  if (document.hidden) return;

  beat++;
  reflect();

  const wait = 1200 + pulse(beat) * 250;
  setTimeout(breathe, wait);
}

/* ═══════════════════════════════════════════
   СОБЫТИЯ — отражение откликается
   ═══════════════════════════════════════════ */
window.addEventListener("click", () => {
  beat = 0;
  reflect();
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    beat = 0;
    reflect();
    breathe();
  }
});

/* ═══════════════════════════════════════════
   СТАРТ
   ═══════════════════════════════════════════ */
reflect();
breathe();
</script>
</body>
</html>
